<svg width="680" height="610" viewBox="0 0 680 610" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="610" fill="#ffffff"/>

<!-- Developer -->
<rect x="270" y="20" width="140" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="340" y="46" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Developer</text>
<line x1="340" y1="64" x2="340" y2="96" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- GitHub repo -->
<rect x="240" y="96" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="340" y="120" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">GitHub repo</text>
<text x="340" y="138" text-anchor="middle" font-size="12" fill="#5F5E5A">push triggers webhook</text>
<line x1="340" y1="152" x2="340" y2="180" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Jenkins pipeline container -->
<rect x="60" y="180" width="560" height="150" rx="16" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="80" y="203" font-size="14" font-weight="600" fill="#26215C">Jenkins pipeline</text>

<rect x="80" y="215" width="130" height="40" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="1"/>
<text x="145" y="239" text-anchor="middle" font-size="14" font-weight="600" fill="#26215C">Checkout</text>

<rect x="230" y="215" width="130" height="40" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="1"/>
<text x="295" y="239" text-anchor="middle" font-size="14" font-weight="600" fill="#26215C">Run tests</text>

<rect x="380" y="215" width="130" height="40" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="1"/>
<text x="445" y="239" text-anchor="middle" font-size="14" font-weight="600" fill="#26215C">Build image</text>

<line x1="210" y1="235" x2="230" y2="235" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="360" y1="235" x2="380" y2="235" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="170" y="270" width="130" height="40" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="1"/>
<text x="235" y="294" text-anchor="middle" font-size="14" font-weight="600" fill="#26215C">Push image</text>

<rect x="320" y="270" width="160" height="40" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="1"/>
<text x="400" y="294" text-anchor="middle" font-size="14" font-weight="600" fill="#26215C">Deploy to server</text>

<line x1="445" y1="255" x2="445" y2="262" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Down to Docker Hub and App Server -->
<line x1="200" y1="330" x2="150" y2="368" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="120" y="352" text-anchor="middle" font-size="12" fill="#5F5E5A">push</text>

<line x1="480" y1="330" x2="480" y2="358" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="530" y="348" text-anchor="middle" font-size="12" fill="#5F5E5A">SSH deploy</text>

<!-- Docker Hub -->
<rect x="50" y="368" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="150" y="392" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Docker Hub</text>
<text x="150" y="410" text-anchor="middle" font-size="12" fill="#5F5E5A">image registry</text>

<line x1="250" y1="396" x2="328" y2="396" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="289" y="386" text-anchor="middle" font-size="12" fill="#5F5E5A">pull</text>

<!-- App server container -->
<rect x="330" y="358" width="300" height="192" rx="16" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="350" y="381" font-size="14" font-weight="600" fill="#04342C">App server (EC2)</text>

<rect x="380" y="395" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="480" y="419" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">App container</text>
<text x="480" y="437" text-anchor="middle" font-size="12" fill="#5F5E5A">Flask, port 5000</text>

<line x1="480" y1="451" x2="480" y2="475" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="380" y="475" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="480" y="499" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">DB container</text>
<text x="480" y="517" text-anchor="middle" font-size="12" fill="#5F5E5A">MySQL, persistent volume</text>

<!-- Legend -->
<text x="60" y="580" font-size="12" fill="#5F5E5A">Gray = external / registry</text>
<text x="230" y="580" font-size="12" fill="#5F5E5A">Purple = CI/CD pipeline</text>
<text x="400" y="580" font-size="12" fill="#5F5E5A">Teal = deployment target</text>
</svg>
