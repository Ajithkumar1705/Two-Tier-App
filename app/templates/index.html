<!DOCTYPE html>
<html>
<head><title>Two-Tier App</title></head>
<body>
    <h1>Two-Tier App Demo</h1>
    <form method="POST">
        <input type="text" name="name" placeholder="Enter your name" required>
        <button type="submit">Submit</button>
    </form>
    <h3>Recent entries:</h3>
    <ul>
        {% for row in rows %}
        <li>{{ row[0] }}</li>
        {% endfor %}
    </ul>
     <p style="color: gray; font-size: 12px;">Build test v1 — deployed via Jenkins</p>
</body>
</html>
